<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f0f10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Чесно">
  <meta name="description" content="Личный трекер расходов и доходов. Все данные хранятся на вашем устройстве.">
  <title>Чесно — расходы и доходы</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="management.css">
</head>
<body>
  <svg style="display:none" aria-hidden="true"><defs>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="left" viewBox="0 0 24 24"><path d="m14 7-5 5 5 5"/></symbol>
    <symbol id="right" viewBox="0 0 24 24"><path d="m10 7 5 5-5 5"/></symbol>
    <symbol id="list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="chart" viewBox="0 0 24 24"><path d="M5 19V9M12 19V4M19 19v-7"/></symbol>
    <symbol id="wallet" viewBox="0 0 24 24"><path d="M20 8H5a2 2 0 0 1 0-4h13v4M4 6v12a2 2 0 0 0 2 2h14V8M20 12h-5v4h5"/><path d="M16.5 14h.01"/></symbol>
    <symbol id="food" viewBox="0 0 24 24"><path d="M5 3v6c0 3 6 3 6 0V3M8 3v18M19 3c-4 3-4 9 0 9V3Zm0 9v9"/></symbol>
    <symbol id="coffee" viewBox="0 0 24 24"><path d="M4 8h12v7a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8ZM16 9h2a3 3 0 0 1 0 6h-2M7 3v2M12 3v2"/></symbol>
    <symbol id="travel" viewBox="0 0 24 24"><path d="m4 10 2-6h12l2 6M4 10h16v8H4v-8ZM6 18v2M18 18v2M7 14h.01M17 14h.01M4 10H2M20 10h2"/></symbol>
    <symbol id="work" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 7V4h8v3M3 12c5 3 13 3 18 0M10 13v3h4v-3"/></symbol>
    <symbol id="arrowout" viewBox="0 0 24 24"><path d="m7 17 10-10M7 7h10v10"/></symbol>
    <symbol id="arrowin" viewBox="0 0 24 24"><path d="M17 7 7 17M7 7v10h10"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="note" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4M16 3v4M4 11h16"/></symbol>
    <symbol id="backspace" viewBox="0 0 24 24"><path d="M9 5h12v14H9L2 12l7-7ZM12 9l6 6M18 9l-6 6"/></symbol>
    <symbol id="signal" viewBox="0 0 24 24"><path d="M3 20v-3M8 20v-7M13 20V9M18 20V5" stroke-width="3"/></symbol>
    <symbol id="battery" viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="3"/><path d="M22 10v4M5 10h12v4H5z" fill="currentColor" stroke="none"/></symbol>
  </defs></svg>

  <svg style="display:none" aria-hidden="true"><defs>
    <symbol id="settings" viewBox="0 0 24 24"><path d="m10 3-.7 2.5-2 .9L5 5.5 3 9l1.8 1.7v2.6L3 15l2 3.5 2.3-.9 2 .9L10 21h4l.7-2.5 2-.9 2.3.9 2-3.5-1.8-1.7v-2.6L21 9l-2-3.5-2.3.9-2-.9L14 3z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="transfer" viewBox="0 0 24 24"><path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4-4-4 4 4 4"/></symbol>
  </defs></svg>
  <main class="app is-loading" id="app" aria-label="Чесно" aria-busy="true">
    <section id="boot-status" class="boot-status" role="status"><p id="boot-message">Открываю данные…</p><button id="retry-boot" class="text-button" hidden>Попробовать снова</button></section>
    <header class="topbar">
      <h1 class="screen-heading" id="screen-heading">Операции</h1>
      <div class="header-actions"><span id="network-status" class="network-status" hidden>Офлайн</span><button class="icon-button" id="settings-toggle" aria-label="Настройки"><svg><use href="#settings"/></svg></button></div>
    </header>
    <div id="update-banner" class="update-banner" hidden><span>Доступно обновление</span><button id="apply-update">Обновить</button></div>
    <div id="home-view" class="view home-view">
      <section class="overview" aria-label="Сводка">
        <div class="balance-caption">Общий остаток</div>
        <div class="balance"><span id="balance">0</span><span class="currency">₽</span></div>
        <div class="account-balances" id="account-balances" role="group" aria-label="Счета и текущие остатки"></div>
        <div class="monthly-heading">
          <button class="scope-select" id="open-accounts" aria-label="Счёт для месячных итогов и истории"><span id="history-scope">Все счета</span><svg><use href="#down"/></svg></button>
          <button class="month-select" data-month-picker><span id="month-label"></span><svg><use href="#down"/></svg></button>
        </div>
        <div class="month-line">
          <div class="month-metric"><span>Расходы</span><strong id="expense">0 <small>₽</small></strong></div>
          <div class="month-metric income-metric"><span>Доходы</span><strong id="income">0 <small>₽</small></strong></div>
        </div>
      </section>
      <section class="history" aria-label="История операций">
        <div id="history"></div>
      </section>
    </div>
    <section id="stats-view" class="view stats-view" hidden aria-label="Статистика">
      <div class="stats-header"><button class="month-select" data-month-picker><span id="stats-month-label"></span><svg><use href="#down"/></svg></button><button id="stats-accounts" class="text-button">Все счета</button></div>
      <div class="stats-switch" role="group" aria-label="Тип статистики"><button class="active" data-stat-type="expense" aria-pressed="true">Расходы</button><button data-stat-type="income" aria-pressed="false">Доходы</button></div>
      <div class="stats-total"><span id="stats-total">0</span><small>₽</small></div><p class="stats-count" id="stats-count"></p>
      <div class="daily-chart" id="daily-chart" aria-label="Операции по дням месяца"></div><div class="chart-axis"><span></span><span></span><span></span></div>
      <div class="breakdown-heading"><h1>Категории</h1><span>Сумма / доля</span></div><div id="breakdown"></div>
    </section>
    <div class="bottom-actions">
      <nav class="tabbar" aria-label="Разделы">
        <button data-view="home" class="active" aria-current="page"><svg><use href="#list"/></svg><span>История</span></button>
        <button id="add" aria-label="Добавить операцию"><svg><use href="#plus"/></svg><span>Добавить</span></button>
        <button data-view="stats"><svg><use href="#chart"/></svg><span>Обзор</span></button>
      </nav>
    </div>
    <section class="entry" id="entry" hidden role="dialog" aria-modal="true" aria-labelledby="entry-title">
      <header class="entry-header"><button class="cancel-button" id="close-entry">Отмена</button><h1 id="entry-title">Операция</h1><button id="save" class="save" disabled aria-label="Сохранить операцию">Добавить</button></header>
      <div class="type-tabs" role="group" aria-label="Тип операции"><button data-type="expense" class="active" aria-pressed="true">Расход</button><button data-type="income" aria-pressed="false">Доход</button><button data-type="transfer" aria-pressed="false">Перевод</button></div>
      <div class="amount-area"><span class="amount-sign" id="amount-sign">−</span><input id="amount" aria-label="Сумма операции" inputmode="none" autocomplete="off" placeholder="0" maxlength="12"><span class="amount-rub">₽</span></div>
      <div class="entry-fields">
        <button class="entry-row" id="entry-account"><svg><use href="#wallet"/></svg><span id="entry-account-name">Основной</span><svg class="chevron"><use href="#down"/></svg></button>
        <button class="entry-row" id="entry-to-account" hidden><svg><use href="#transfer"/></svg><span id="entry-to-account-name">Куда перевести</span><svg class="chevron"><use href="#down"/></svg></button>
        <button class="entry-row category-row" id="entry-category"><svg id="entry-category-icon"><use href="#food"/></svg><span id="entry-category-name">Категория и подкатегория</span><svg class="chevron"><use href="#right"/></svg></button>
        <label class="entry-row note-row"><svg><use href="#note"/></svg><input id="description" type="text" placeholder="Заметка, если нужна" aria-label="Описание операции" maxlength="1000"></label>
      </div>
      <label class="entry-date"><span>Дата</span><input id="entry-date" type="date" aria-label="Дата операции" required></label>
      <div class="recent-pairs" id="recent-pairs" aria-label="Частые категории"></div>
      <p id="entry-error" class="form-error" role="alert" hidden></p>
      <div class="entry-bottom"><p id="entry-hint" class="entry-hint" aria-live="polite">Введи сумму и выбери категорию</p><div class="keypad" aria-label="Цифровая клавиатура">
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="," class="decimal-key">,</button><button data-key="0">0</button><button data-key="back" class="backspace" aria-label="Удалить цифру"><svg><use href="#backspace"/></svg></button>
      </div></div>
      <button id="delete-operation" class="delete-operation" hidden>Удалить операцию</button>
    </section>
    <div class="picker-overlay" id="picker-overlay" hidden>
      <section class="picker" id="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title"><div class="drag-handle"></div><header class="picker-header"><h2 id="picker-title">Выбрать счёт</h2><button class="icon-button" id="close-picker" aria-label="Закрыть выбор"><svg><use href="#close"/></svg></button></header><p id="picker-error" class="form-error" role="alert" hidden></p><div id="picker-content"></div></section>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
